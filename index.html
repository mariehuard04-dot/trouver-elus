<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 5px 10px; color: #222; text-align: center; }
    .box { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
    input { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; text-transform: uppercase; width: 150px; }
    button { padding: 10px 18px; font-size: 16px; background: #111; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #333; }
    .elu { background: #f4f4f4; padding: 12px 15px; border-radius: 5px; margin-bottom: 8px; text-align: left; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
    .btn-envoi { display: inline-block; padding: 11px 16px; background: #111; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 14px; }
    .btn-copier { padding: 11px 16px; background: #e5e5e5; color: #111; border: 1px solid #ccc; border-radius: 5px; font-weight: bold; font-size: 14px; cursor: pointer; }
    .btn-copier:hover { background: #d5d5d5; }
    .erreur-box { background: #f4f4f4; border: 1px solid #ddd; padding: 14px; border-radius: 5px; font-size: 14px; text-align: left; color: #222; line-height: 1.5; }
    .erreur-box a { color: #111; font-weight: bold; }
    .compteur-section { margin-top: 25px; padding-top: 18px; border-top: 1px solid #eee; }
    .compteur-texte { font-size: 16px; margin-bottom: 10px; font-weight: bold; }
    .btn-confirmer { padding: 12px 22px; font-size: 15px; font-weight: bold; background: #111; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
    .btn-confirmer:disabled { background: #2e7d32; cursor: default; }
  </style>
</head>
<body>

  <div class="box">
    <input type="text" id="cp" placeholder="Ex: G1A 1A3" maxlength="7">
    <button type="button" onclick="chercherElus()">Trouver mes élu·e·s</button>
  </div>
  
  <div id="resultat"></div>

  <div class="compteur-section">
    <div class="compteur-texte">Courriels envoyés : <span id="nb-courriels">0</span></div>
    <button type="button" class="btn-confirmer" id="btnConfirmer" onclick="ajouterCourriel()">J'ai envoyé un beau courriel ✓</button>
  </div>

  <script>
    const URL_PONT_GOOGLE = "https://google.com";

    const SUJET_TEXTE = "Préoccupation concernant le projet de GNL Marinvest";
    const MESSAGE_TEXTE = `Bonjour à vous,

Si je vous écris aujourd'hui, c'est pour vous faire part de ma préoccupation devant l'intention du gouvernement Carney de ramener un projet de gaz naturel liquéfié au Québec. Marinvest est une compagnie norvégienne qui souhaite construire une usine flottante sur le fleuve Saint-Laurent à Baie-Comeau, connectée à un pipeline de 1000 km afin d'exporter du gaz en Europe avec le soutien tacite du gouvernement. En plus de nous éloigner des objectifs de réduction de gaz à effet de serre au pays, ce projet menace des milieux naturels déjà fragiles.

Malgré ces inquiétants développements, une mobilisation citoyenne considérable a permis en 2021 d'arrêter le projet de GNL Québec au Saguenay et se relance actuellement pour protéger la biodiversité et le paysage québécois. Pouvons-nous compter sur votre appui?

Solidairement,`;

    const SUJET = encodeURIComponent(SUJET_TEXTE);
    const MESSAGE = encodeURIComponent(MESSAGE_TEXTE);
    let listeCourriels = [];
    let aVoteSession = false;

    function lireMemoire(cle) {
      try { return localStorage.getItem(cle); } catch (e) { return null; }
    }

    function ecrireMemoire(cle, valeur) {
      try { localStorage.setItem(cle, valeur); } catch (e) {}
    }

    function desactiverBouton() {
      aVoteSession = true;
      const btn = document.getElementById("btnConfirmer");
      if (btn) {
        btn.disabled = true;
        btn.innerText = "Merci pour votre envoi ! ✓";
      }
    }

        window.addEventListener("DOMContentLoaded", async () => {
      if (lireMemoire("aDejaVoteMarinvest") === "true") {
        desactiverBouton();
      }

      try {
        const res = await fetch(`${URL_PONT_GOOGLE}?action=get_count&t=${Date.now()}`);
        const data = await res.json();
        if (data.count !== undefined) {
          document.getElementById("nb-courriels").innerText = data.count;
        }
      } catch (e) {}
    });

    async function ajouterCourriel() {
      if (aVoteSession || lireMemoire("aDejaVoteMarinvest") === "true") return;
      const btn = document.getElementById("btnConfirmer");
      btn.innerText = "Enregistrement...";
      btn.disabled = true;

      try {
        const res = await fetch(`${URL_PONT_GOOGLE}?action=up&t=${Date.now()}`);
        const data = await res.json();
        if (data.count !== undefined) {
          document.getElementById("nb-courriels").innerText = data.count;
          ecrireMemoire("aDejaVoteMarinvest", "true");
          desactiverBouton();
        } else {
          throw new Error("Réponse invalide");
        }
      } catch (e) {
        btn.disabled = false;
        btn.innerText = "J'ai envoyé un beau courriel ✓";
      }
    }


    async function chercherElus() {
      const cp = document.getElementById('cp').value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
      const resDiv = document.getElementById('resultat');
      if (cp.length !== 6) {
        resDiv.innerHTML = "<p>Veuillez entrer un code postal valide (ex. G1A 1A3).</p>";
        return;
      }
      resDiv.innerHTML = "<p>Recherche en cours...</p>";

      try {
        const rep = await fetch(`${URL_PONT_GOOGLE}?cp=${cp}`, { redirect: "follow" });
        const texteBrut = await rep.text();
        const data = JSON.parse(texteBrut);

        if (data.error || (!data.representatives_centroid && !data.representatives_concordance)) {
          resDiv.innerHTML = `<p>Code postal non trouvé (${data.error || 'aucun résultat'}).</p>`;
          return;
        }

        const liste = [...(data.representatives_centroid || []), ...(data.representatives_concordance || [])];
        let html = "";
        listeCourriels = [];
        const vus = new Set();

        liste.forEach(elu => {
          const titre = elu.elected_office || "";
          if (["Mayor", "Maire", "Mairesse", "MNA", "MP"].includes(titre) && !vus.has(elu.name)) {
            vus.add(elu.name);
            let role = titre === "MP" ? "Député·e fédéral·e" : (titre === "MNA" ? "Député·e provincial·e" : "Maire / Mairesse");
            html += `<div class="elu"><strong>${role} :</strong> ${elu.name} (${elu.district_name})<br>`;
            if (elu.email) {
              listeCourriels.push(elu.email);
              html += `<a href="mailto:${elu.email}?subject=${SUJET}&body=${MESSAGE}">${elu.email}</a></div>`;
            } else {
              html += `<em>Courriel non disponible</em></div>`;
            }
          }
        });

        if (listeCourriels.length > 0) {
          html += `<div class="actions">
            <a class="btn-envoi" href="mailto:${listeCourriels.join(',')}?subject=${SUJET}&body=${MESSAGE}">✉️ Écrire aux ${listeCourriels.length} élu·e·s</a>
            <button type="button" class="btn-copier" id="btnCopier" onclick="copierAdresses()">📋 Copier les adresses</button>
            <button type="button" class="btn-copier" id="btnTexte" onclick="copierTexte()">📄 Copier la lettre</button>
          </div>`;
        }
        resDiv.innerHTML = html || "<p>Aucun élu trouvé pour ce code postal.</p>";
      } catch (e) {
        resDiv.innerHTML = `<div class="erreur-box">
          <strong>La recherche automatique est momentanément indisponible.</strong><br>
          Trouvez vos élus en un clic sur les répertoires officiels :<br>
          • <a href="https://noscommunes.ca" target="_blank">Député·e fédéral·e (NosCommunes)</a><br>
          • <a href="https://assnat.qc.ca" target="_blank">Député·e provincial·e (Assemblée nationale)</a><br>
          • <a href="https://gouv.qc.ca" target="_blank">Maire / Mairesse (MAMH)</a>
          <div class="actions"><button type="button" class="btn-copier" id="btnTexte" onclick="copierTexte()">📄 Copier la lettre</button></div>
        </div>`;
      }
    }

    function copierDansPressePapier(texte, callbackSucces) {
      var zoneTemp = document.createElement("textarea");
      zoneTemp.value = texte;
      zoneTemp.setAttribute("readonly", "");
      zoneTemp.style.position = "fixed";
      zoneTemp.style.left = "-9999px";
      document.body.appendChild(zoneTemp);
      zoneTemp.select();
      zoneTemp.setSelectionRange(0, 99999);

      var reussi = false;
      try {
        reussi = document.execCommand("copy");
      } catch (e) {
        reussi = false;
      }
      document.body.removeChild(zoneTemp);

      if (reussi) {
        callbackSucces();
      } else if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(texte).then(callbackSucces);
      }
    }

    function copierAdresses() {
      copierDansPressePapier(listeCourriels.join(', '), function() {
        const btn = document.getElementById('btnCopier');
        btn.innerText = "✓ Adresses copiées !";
        setTimeout(() => { btn.innerText = "📋 Copier les adresses"; }, 2500);
      });
    }

    function copierTexte() {
      const complet = `Objet : ${SUJET_TEXTE}\n\n${MESSAGE_TEXTE}`;
      copierDansPressePapier(complet, function() {
        const btn = document.getElementById('btnTexte');
        btn.innerText = "✓ Lettre copiée !";
        setTimeout(() => { btn.innerText = "📄 Copier la lettre"; }, 2500);
      });
    }
  </script>
</body>
</html>
